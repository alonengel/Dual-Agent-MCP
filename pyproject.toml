[project]
name = "copthief"
version = "1.0.0"
description = "Dual AI agent Cop-and-Thief pursuit game over MCP servers (HUJI/UoH Course - Exercise 6)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Team CopThief" }]
dependencies = [
    "fastmcp>=2.3.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.2",
    "numpy>=2.0.0",
    "matplotlib>=3.9.0",
    "rich>=13.7.0",
    "google-api-python-client>=2.140.0",
    "google-auth-oauthlib>=1.2.1",
    "google-auth>=2.34.0",
]

[project.scripts]
copthief = "copthief.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copthief"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src"]
omit = ["src/copthief/main.py", "*/tests/*", "src/copthief/gui/*", "src/copthief/reporting/emailer.py", "src/copthief/agents/*server.py"]

[tool.coverage.report]
fail_under = 85
