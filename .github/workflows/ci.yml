# Continuous Integration: lint + test on every push and pull request.
#
# Mirrors the local quality gates the submission guidelines mandate:
# - the 150-line-per-file cap (section 3.2, hard limit)
# - ruff (zero violations)
# - pytest with the coverage gate (fail_under = 85, configured in pyproject.toml)
# - an end-to-end CLI smoke.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: lint + test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Verify the 150-line cap (section 3.2)
        run: uv run python scripts/check_line_cap.py

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Test with coverage gate
        run: uv run pytest --cov --cov-report=term --cov-report=xml

      - name: Upload coverage XML
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

      - name: CLI smoke
        run: |
          uv run copthief --help
          uv run copthief selfplay --help
