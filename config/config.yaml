# Central game + application configuration. No game parameter is hardcoded in source.
version: "1.0.0"

game:
  grid_size: [5, 5]      # the 5x5 game board (PDF 4.2/10 default); resize only for the
                         # 4.5 sanity stages (2x2..4x4) or an agreed inter-group bonus game
  max_moves: 25          # max moves per subgame before the thief survives
  num_games: 6           # subgames per full game (3 as cop + 3 as thief in inter-group play)
  max_barriers: 5        # max barriers the cop may place per subgame
  origin: 1              # board origin (cells numbered starting at this value)
  diagonal_moves: true   # movement allowed in all 8 directions
  # Partial observation (DecPOMDP, PDF 4.5): an agent only knows the opponent's exact
  # cell within this Chebyshev radius; beyond it, it relies on free-text messages.
  vision_radius: 1       # base radius => partial observation genuinely matters on 5x5
  disclosure: "partial"  # partial = reveal exact cell only when seen; exact = always
  deception: true        # when hidden, an agent may state a false location (PDF 5.1)
  # Agent-level rule negotiation (inter-group bonus only; self-game keeps base rules).
  # Each agent advocates the radius favouring its role; it sticks only if BOTH agree,
  # else the base radius applies. Cop prefers wider vision, thief prefers narrower.
  negotiable: false
  cop_pref_radius: 2
  thief_pref_radius: 1

scoring:
  cop_win: 20
  thief_win: 10
  cop_loss: 5
  thief_loss: 5

bonus:
  win: 10
  lose: 7
  tie: 5

team:
  group_name: "anrbj666"     # course group ID code (used to match inter-group reports)
  students:
    - name: "Alon Engel"
      id: "208015032"
    - name: "Renat Karimov"
      id: "324511369"
  github_repo: "https://github.com/alonengel/Dual-Agent-MCP"
  timezone: "Asia/Jerusalem"

mcp:
  transport: "http"          # HTTP transport even locally (prepares for cloud)
  host: "127.0.0.1"
  # Team's fixed public MCP endpoint (Cloudflare named tunnel -> serve-combined).
  # Local dev overrides these to 127.0.0.1:8080 via COPTHIEF_*_URL (run_local_cloud.ps1).
  cop_url: "https://mcp.alon.website/cop/mcp"
  thief_url: "https://mcp.alon.website/thief/mcp"
  cop_port: 8181
  thief_port: 8182
  combined_port: 8080    # single-endpoint mode: serves /cop/mcp and /thief/mcp
  request_timeout: 120   # seconds per MCP tool call (raise for slow public tunnels)
  sse_read_timeout: 600  # seconds for the long-lived server->client stream (default ~5m)

llm:
  # mock (offline default) | claude (CLI+Anthropic fallback) | ollama | api.
  # Overridable via COPTHIEF_LLM_PROVIDER; set it to "claude" in .env for real runs.
  provider: "mock"
  model: "llama3.2"          # ollama model; Claude uses its own default if non-claude
  api_kind: "openai"         # openai | anthropic | gemini (when provider=api)
  temperature: 0.4
  max_tokens: 512

reporting:
  email_to: "rmisegal+uoh26b@gmail.com"
  results_dir: "results"

strategy:
  kind: "adaptive"           # heuristic | adaptive (anticipates the enemy) | qtable
  cop_uses_barriers: true    # cop uses barriers only when it cannot advance (need-based)
  qtable:
    learning_rate: 0.1
    discount_factor: 0.9
    epsilon: 0.1
